name: Publish to pub.dev on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Install Flutter SDK (provides flutter SDK dependency for dart pub get)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Install standalone Dart SDK (provides OIDC-capable dart pub publish)
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify toolchain
        run: |
          which dart
          dart --version
          flutter --version
          dart pub get

      - name: Detect version change
        id: version
        run: |
          set -e
          NEW_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected new version: $NEW_VERSION"

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD~1:pubspec.yaml 2>/dev/null \
                          | grep -E '^version:' | head -1 | awk '{print $2}' || echo "")
          else
            OLD_VERSION=""
          fi
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$NEW_VERSION" ] && [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: '$OLD_VERSION' -> '$NEW_VERSION'"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($NEW_VERSION), skip publishing."
          fi

      - name: Debug OIDC config
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_ENV: $GITHUB_ENV"

      - name: Dry-run check
        if: steps.version.outputs.changed == 'true'
        run: dart pub publish --dry-run

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: dart pub publish --force
